services:
  - type: web
    name: rentwise-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: DATABASE_URL
        value: sqlite:///./backend/data/rentwise.db
      - key: DEMO_MODE
        value: "true"
